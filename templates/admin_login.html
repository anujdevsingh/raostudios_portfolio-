<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Rao Studios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #000000 0%, #1a1a1a 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-card {
            max-width: 450px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            border-radius: 15px;
            overflow: hidden;
            border: 1px solid #333333;
            backdrop-filter: blur(10px);
        }
        .card-header {
            background: linear-gradient(135deg, #1e1e1e 0%, #2a2a2a 100%);
            color: white;
            padding: 30px 20px;
            text-align: center;
            border-bottom: 1px solid #333333;
        }
        .card-header img {
            width: 70px;
            margin-bottom: 15px;
            filter: brightness(1.2);
        }
        .card-header h3 {
            color: #ffffff;
            font-weight: 700;
            margin-bottom: 5px;
        }
        .card-header .subtitle {
            color: #cccccc;
            font-size: 0.9rem;
            margin-top: 5px;
        }
        .card-body {
            background: #1e1e1e;
            padding: 40px 30px;
        }
        .form-label {
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 10px;
        }
        .form-control {
            background-color: #2a2a2a;
            border: 1px solid #444444;
            border-radius: 8px;
            color: #ffffff;
            padding: 12px 15px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        .form-control:focus {
            background-color: #333333;
            border-color: #28a745;
            box-shadow: 0 0 10px rgba(40, 167, 69, 0.3);
            color: #ffffff;
        }
        .form-control::placeholder {
            color: #888888;
        }
        .btn-admin {
            background: linear-gradient(45deg, #28a745, #20c997);
            border: none;
            color: white;
            width: 100%;
            padding: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 8px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn-admin:hover {
            background: linear-gradient(45deg, #20c997, #17a2b8);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(40, 167, 69, 0.4);
        }
        .btn-admin:active {
            transform: translateY(0);
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #cccccc;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }
        .back-link:hover {
            color: #28a745;
        }
        .back-link i {
            margin-right: 8px;
        }
        .alert {
            margin-bottom: 25px;
            border-radius: 8px;
            border: none;
        }
        .alert-danger {
            background: rgba(220, 53, 69, 0.15);
            border-left: 4px solid #dc3545;
            color: #ffffff;
        }
        .alert-success {
            background: rgba(40, 167, 69, 0.15);
            border-left: 4px solid #28a745;
            color: #ffffff;
        }
        .security-info {
            background: rgba(23, 162, 184, 0.1);
            border: 1px solid rgba(23, 162, 184, 0.3);
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
            color: #cccccc;
            font-size: 0.9rem;
        }
        .security-info i {
            color: #17a2b8;
            margin-right: 8px;
        }
        @media (max-width: 576px) {
            .login-card {
                margin: 20px;
                max-width: none;
            }
            .card-body {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="login-card card">
        <div class="card-header">
            <img src="{{ url_for('static', filename='svg/logo.svg') }}" alt="Rao Studios Logo" class="logo-image">
            <h3 class="mb-0">Admin Access</h3>
            <p class="subtitle">Secure Dashboard Login</p>
        </div>
        <div class="card-body">
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}
            
            <form action="{{ url_for('admin_verify') }}" method="post">
                <div class="mb-4">
                    <label for="password" class="form-label">Admin Password</label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="Enter admin password" required autofocus>
                </div>
                <button type="submit" class="btn btn-admin">
                    <i class="fas fa-sign-in-alt me-2"></i>Access Dashboard
                </button>
            </form>
            
            <div class="security-info">
                <i class="fas fa-shield-alt"></i>
                This area is restricted to authorized personnel only.
            </div>
            
            <a href="{{ url_for('index') }}" class="back-link">
                <i class="fas fa-arrow-left"></i>Return to Website
            </a>
        </div>
    </div>

    <script>
        // Handle fallback for missing SVG logo
        document.addEventListener('DOMContentLoaded', function() {
            const logoImage = document.querySelector('.logo-image');
            if (logoImage) {
                logoImage.addEventListener('error', function() {
                    this.src = "{{ url_for('static', filename='img/logo.png') }}";
                });
            }
        });
    </script>
</body>
</html>
