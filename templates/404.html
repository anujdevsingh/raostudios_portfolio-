{% extends 'base.html' %}

{% block title %}Page Not Found - Rao Studios{% endblock %}

{% block content %}
<section class="error-section">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8 text-center">
                <div class="error-content" data-aos="fade-up">
                    <div class="error-code">404</div>
                    <h2 class="error-title">Page Not Found</h2>
                    <p class="error-message">
                        Sorry, the page you are looking for doesn't exist or has been moved.
                    </p>
                    <div class="error-actions mt-4">
                        <a href="{{ url_for('index') }}" class="btn btn-primary btn-lg me-3">
                            <i class="fas fa-home me-2"></i>Go Home
                        </a>
                        <a href="{{ url_for('index', _anchor='contact') }}" class="btn btn-outline-light btn-lg">
                            <i class="fas fa-envelope me-2"></i>Contact Us
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<style>
.error-section {
    background: linear-gradient(135deg, #000000 0%, #1a1a1a 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    padding: 50px 0;
}

.error-content {
    color: #ffffff;
}

.error-code {
    font-size: 8rem;
    font-weight: 900;
    background: linear-gradient(45deg, #28a745, #20c997, #17a2b8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1;
    margin-bottom: 20px;
}

.error-title {
    font-size: 2.5rem;
    font-weight: 700;
    margin-bottom: 20px;
    color: #ffffff;
}

.error-message {
    font-size: 1.2rem;
    color: #cccccc;
    margin-bottom: 30px;
}

.btn-primary {
    background: linear-gradient(45deg, #28a745, #20c997);
    border: none;
    padding: 12px 30px;
    font-weight: 600;
    border-radius: 8px;
    transition: all 0.3s ease;
}

.btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(40, 167, 69, 0.3);
}

.btn-outline-light {
    border: 2px solid #ffffff;
    color: #ffffff;
    padding: 12px 30px;
    font-weight: 600;
    border-radius: 8px;
    transition: all 0.3s ease;
}

.btn-outline-light:hover {
    background: #ffffff;
    color: #000000;
    transform: translateY(-2px);
}

@media (max-width: 768px) {
    .error-code {
        font-size: 6rem;
    }
    
    .error-title {
        font-size: 2rem;
    }
    
    .error-message {
        font-size: 1.1rem;
    }
    
    .error-actions .btn {
        display: block;
        width: 100%;
        margin-bottom: 15px;
    }
    
    .error-actions .btn:last-child {
        margin-bottom: 0;
    }
}
</style>
{% endblock %}
