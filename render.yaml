services:
  - type: web
    name: raostudios-portfolio
    env: python
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --timeout 120 --keep-alive 60 --max-requests 1000 --preload app:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: raostudios-db
          property: connectionString
      # Add these environment variables in Render dashboard:
      # - key: PAYU_MERCHANT_KEY
      #   value: your-payu-merchant-key
      # - key: PAYU_MERCHANT_SALT
      #   value: your-payu-merchant-salt
      # - key: PAYU_BASE_URL
      #   value: https://test.payu.in (for test) or https://secure.payu.in (for live)
      # - key: PAYU_SUCCESS_URL
      #   value: /payment/success
      # - key: PAYU_FAILURE_URL
      #   value: /payment/failure
      # - key: SECRET_KEY
      #   value: your-flask-secret-key
      # - key: MAIL_USERNAME
      #   value: your-gmail-username
      # - key: MAIL_PASSWORD
      #   value: your-gmail-app-password
      # - key: MAIL_DEFAULT_SENDER
      #   value: your-default-sender-email
    autoDeploy: true

databases:
  - name: raostudios-db
    databaseName: raostudios
    user: raostudios_user 